[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visa-itl1"
version = "0.2.0"
description = "Commercial-property-weighted allocation of Visa postcode-area spend to ITL1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=12", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
visa-itl1 = "visa_itl1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visa_itl1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
